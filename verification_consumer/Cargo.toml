[package]
name = "verification_consumer"
version = "0.1.0"
edition = "2021"

[dependencies]
aws_lambda_events = { version = "1.0.0", default-features = false, features = ["sqs"] }
lambda_runtime = "1.0.1"
serde = "1.0.228"
serde_json = "1.0.150"
aws-config = "1.10.1"
aws-sdk-dynamodb = "1.119.0"

tokio = { version = "1", features = ["macros"] }
uuid = {version = "1.23.4", features = ["v4", "serde"]}
serde_dynamo = {version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
aws-sdk-sqs = "1.105.0"
