[package]
name = "verification_consumer"
version = "0.1.0"
edition = "2021"

[dependencies]
aws_lambda_events = { version = "1.0.0", default-features = false, features = ["sqs"] }

lambda_runtime = "1.0.1"
tokio = { version = "1", features = ["macros"] }
serde = "1.0.228"
serde_json = "1.0.150"
aws-sdk-sesv2 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
mail-send = "0.6.2"
mail-builder = "0.5"