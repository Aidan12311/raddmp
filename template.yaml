  AWSTemplateFormatVersion: '2010-09-09'
  Transform: AWS::Serverless-2016-10-31
  Description: > 
    RADD sam deployment template

  Parameters:
    JwtSecret:
      Type: String
      NoEcho: true
      Default: JWT_SECRET

  Globals:
    Function:
      Timeout: 3
      MemorySize: 128
    Api:
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'content-type'"
        AllowOrigin: "'*'"
  
  Resources:
    ApplicationResourceGroup:
      Type: AWS::ResourceGroups::Group
      Properties:
        Name: !Sub "ApplicationInsights-SAM-${AWS::StackName}"
        ResourceQuery:
          Type: CLOUDFORMATION_STACK_1_0
  
    ApplicationInsightsMonitoring:
      Type: AWS::ApplicationInsights::Application
      Properties:
        ResourceGroupName: !Ref ApplicationResourceGroup
        AutoConfigurationEnabled: 'true'
  
    RaddGateway:
      Type: AWS::Serverless::Api
      Properties:
        Name: RaddGateway
        StageName: Prod
        Cors:
          AllowMethods: "'GET,POST,OPTIONS'"
          AllowHeaders: "'content-type'"
          AllowOrigin: "'*'"
        Auth:
          Authorizers:
            RaddAuthorizer:
              FunctionArn: !GetAtt AuthFunction.Arn
              FunctionPayloadType: REQUEST
              Identity:
                Headers:
                  - Cookie
                ReauthorizeEvery: 300
  
    AuthFunction:
      Type: AWS::Serverless::Function
      Properties:
        CodeUri: auth/
        Handler: login_auth.lambda_handler
        Runtime: python3.13
        Architectures:
          - x86_64
        Environment:
          Variables:
            JWT_SECRET: !Ref JwtSecret
  
    AuthQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: AuthQueue
    
    VerificationConsumer:
      Type: AWS::Serverless::Function
      Metadata:
        BuildMethod: rust-cargolambda
      Properties:
        CodeUri: verification_consumer/
        Handler: bootstrap
        Runtime: provided.al2023
        Architectures:
          - x86_64
        Environment:
          Variables:
            TABLE_NAME: !Ref UserTable
        Policies:
          - DynamoDBCrudPolicy:
              TableName: !Ref UserTable
          - SQSPollerPolicy:
              QueueName: !GetAtt AuthQueue.QueueName
        Events:
          AuthQueueEvent:
            Type: SQS
            Properties:
              Queue: !GetAtt AuthQueue.Arn
              BatchSize: 10
              Enabled: true
  
    UserTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: RaddUsersTable
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UsernameIndex
            KeySchema:
              - AttributeName: username
                KeyType: HASH
            Projection:
              ProjectionType: ALL
  
    CreateUser:
      Type: AWS::Serverless::Function
      Metadata:
        BuildMethod: rust-cargolambda
      Properties:
        CodeUri: create_user/
        Handler: bootstrap
        Runtime: provided.al2023
        Architectures:
          - x86_64
        Environment:
          Variables:
            TABLE_NAME: !Ref UserTable
            QUEUE_URL: !Ref AuthQueue
        Policies:
          - DynamoDBCrudPolicy:
              TableName: !Ref UserTable
          - SQSSendMessagePolicy:
              QueueName: !GetAtt AuthQueue.QueueName
        Events:
          CreateUser:
            Type: Api
            Properties:
              RestApiId: !Ref RaddGateway
              Path: /users
              Method: POST
  
    GetUser:
      Type: AWS::Serverless::Function
      Metadata:
        BuildMethod: rust-cargolambda
      Properties:
        CodeUri: get_user/
        Handler: bootstrap
        Runtime: provided.al2023
        Architectures:
          - x86_64
        Environment:
          Variables:
            TABLE_NAME: !Ref UserTable
        Policies:
          - DynamoDBReadPolicy:
              TableName: !Ref UserTable
        Events:
          GetUser:
            Type: Api
            Properties:
              RestApiId: !Ref RaddGateway
              Path: /users
              Method: GET
              Auth:
                Authorizer: RaddAuthorizer
  
    Login:
      Type: AWS::Serverless::Function
      Metadata:
        BuildMethod: rust-cargolambda
      Properties:
        CodeUri: login_user/
        Handler: bootstrap
        Runtime: provided.al2023
        Architectures:
          - x86_64
        Environment:
          Variables:
            TABLE_NAME: !Ref UserTable
            JWT_SECRET: !Ref JwtSecret
        Policies:
          - DynamoDBReadPolicy:
              TableName: !Ref UserTable
        Events:
          Login:
            Type: Api
            Properties:
              RestApiId: !Ref RaddGateway
              Path: /login
              Method: POST
  
  Outputs:
    ApiUrl:
      Description: Base URL for the API
      Value: !Sub "https://${RaddGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  
    UserTableName:
      Description: DynamoDB table name for users
      Value: !Ref UserTable
  
    AuthQueueUrl:
      Description: SQS queue URL for auth events
      Value: !Ref AuthQueue
  
    CreateUserFunctionArn:
      Description: Create User Lambda ARN
      Value: !GetAtt CreateUser.Arn
  
    GetUserFunctionArn:
      Description: Get User Lambda ARN
      Value: !GetAtt GetUser.Arn
  
    LoginFunctionArn:
      Description: Login Lambda ARN
      Value: !GetAtt Login.Arn
