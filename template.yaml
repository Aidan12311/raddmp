AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  RADD sam deployment template

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Default: JWT_SECRET

Globals:
  Function:
    Timeout: 3
    # Lambda CPU/network throughput scale with memory -- 128MB is the
    # minimum possible allocation and was slowing down both cold starts and
    # steady-state execution (AWS SDK init, boto3 import, JSON/JWT work).
    MemorySize: 256
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'http://localhost:3000'"
      AllowCredentials: true

Resources:
  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub "ApplicationInsights-SAM-${AWS::StackName}"
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0

  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName: !Ref ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'

  RaddGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: RaddGateway
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'content-type'"
        AllowOrigin: "'http://localhost:3000'"
        AllowCredentials: true
      Auth:
        Authorizers:
          RaddAuthorizer:
            FunctionArn: !GetAtt AuthFunction.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers:
                - Cookie
              ReauthorizeEvery: 300

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/auth/
      Handler: login_auth.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret

  AuthQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: AuthQueue

  VerificationConsumer:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: lambdas/verification_consumer/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref UserTable
          QUEUE_URL: !Ref AuthQueue
          SENDER_EMAIL: "zomhorsethompson2656@gmail.com"
          GMAIL_APP_PASSWORD: "acpe kets qsex okab "
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTable
        - SQSPollerPolicy:
            QueueName: !GetAtt AuthQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
      Events:
        AuthQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AuthQueue.Arn
            BatchSize: 10
            Enabled: true

  UserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RaddUsersTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  MusicTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RaddMusicTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: MusicId
          AttributeType: S
      KeySchema:
        - AttributeName: MusicId
          KeyType: HASH

  PlaylistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RaddPlaylistTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PlaylistId
          AttributeType: S
        - AttributeName: UserId
          AttributeType: S
      KeySchema:
        - AttributeName: PlaylistId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: UserId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  PlaylistMusicTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RaddPlaylistMusicTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PlaylistId
          AttributeType: S
        - AttributeName: MusicId
          AttributeType: S
      KeySchema:
        - AttributeName: PlaylistId
          KeyType: HASH
        - AttributeName: MusicId
          KeyType: RANGE

  Mp3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000

  Mp3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Mp3Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${Mp3Bucket.Arn}/*"

  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000
  
  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${ImageBucket.Arn}/*"

  CreateUser:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: lambdas/create_user/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref UserTable
          QUEUE_URL: !Ref AuthQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AuthQueue.QueueName
      Events:
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /users
            Method: POST

  GetUser:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: lambdas/get_user/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref UserTable
          JWT_SECRET: !Ref JwtSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
      Events:
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /users
            Method: GET
            Auth:
              Authorizer: RaddAuthorizer

  Login:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: lambdas/login_user/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref UserTable
          JWT_SECRET: !Ref JwtSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /login
            Method: POST

  VerifyUser:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: lambdas/verify/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref UserTable
          JWT_SECRET: !Ref JwtSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTable
      Events:
        VerifyUser:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /users/verify
            Method: GET

  CreateMusic:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/music_crud/
      Handler: create_music.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref MusicTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref MusicTable
      Events:
        CreateMusic:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /music
            Method: POST

  ListMusic:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/music_crud/
      Handler: list_music.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref MusicTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MusicTable
      Events:
        ListMusic:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /music
            Method: GET

  GetMusic:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/music_crud/
      Handler: get_music.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref MusicTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MusicTable
      Events:
        GetMusic:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /music/{musicId}
            Method: GET

  UpdateMusic:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/music_crud/
      Handler: update_music.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref MusicTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MusicTable
      Events:
        UpdateMusic:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /music/{musicId}
            Method: PUT

  DeleteMusic:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/music_crud/
      Handler: delete_music.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref MusicTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MusicTable
      Events:
        DeleteMusic:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /music/{musicId}
            Method: DELETE

  FileUploadUrl:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/music_crud/
      Handler: file_upload_url.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          MP3_BUCKET: !Ref Mp3Bucket
          IMAGE_BUCKET: !Ref ImageBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref Mp3Bucket
        - S3WritePolicy:
            BucketName: !Ref ImageBucket
      Events:
        FileUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /music/upload-url
            Method: POST
            
  Metrics:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: lambdas/metrics
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Policies:
      Policies:
        - DynamoDBCrudPolicy:
              TableName: !Ref UserTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MusicTable
      Events:
        Metrics:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /metrics
            Method: GET

  CreatePlaylist:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/playlist_crud/
      Handler: create_playlist.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref PlaylistTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistTable
      Events:
        CreatePlaylist:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /playlists
            Method: POST
            Auth:
              Authorizer: RaddAuthorizer

  ListPlaylists:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/playlist_crud/
      Handler: list_playlists.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref PlaylistTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlaylistTable
      Events:
        ListPlaylists:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /playlists
            Method: GET
            Auth:
              Authorizer: RaddAuthorizer

  ListPlaylistMusic:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/playlist_crud/
      Handler: list_playlist_music.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          PLAYLIST_TABLE_NAME: !Ref PlaylistTable
          PLAYLIST_MUSIC_TABLE_NAME: !Ref PlaylistMusicTable
          MUSIC_TABLE_NAME: !Ref MusicTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlaylistTable
        - DynamoDBReadPolicy:
            TableName: !Ref PlaylistMusicTable
        - DynamoDBReadPolicy:
            TableName: !Ref MusicTable
      Events:
        ListPlaylistMusic:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /playlists/{playlistId}/music
            Method: GET
            Auth:
              Authorizer: RaddAuthorizer

  AddMusicToPlaylist:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/playlist_crud/
      Handler: add_music_to_playlist.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          PLAYLIST_TABLE_NAME: !Ref PlaylistTable
          PLAYLIST_MUSIC_TABLE_NAME: !Ref PlaylistMusicTable
          MUSIC_TABLE_NAME: !Ref MusicTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlaylistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistMusicTable
        - DynamoDBReadPolicy:
            TableName: !Ref MusicTable
      Events:
        AddMusicToPlaylist:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /playlists/{playlistId}/music
            Method: POST
            Auth:
              Authorizer: RaddAuthorizer

  RemoveMusicFromPlaylist:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/playlist_crud/
      Handler: remove_music_from_playlist.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          PLAYLIST_TABLE_NAME: !Ref PlaylistTable
          PLAYLIST_MUSIC_TABLE_NAME: !Ref PlaylistMusicTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlaylistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistMusicTable
      Events:
        RemoveMusicFromPlaylist:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /playlists/{playlistId}/music/{musicId}
            Method: DELETE
            Auth:
              Authorizer: RaddAuthorizer

  UpdatePlaylist:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/playlist_crud/
      Handler: update_playlist.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref PlaylistTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistTable
      Events:
        UpdatePlaylist:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /playlists/{playlistId}
            Method: PUT
            Auth:
              Authorizer: RaddAuthorizer

  DeletePlaylist:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/playlist_crud/
      Handler: delete_playlist.lambda_handler
      Runtime: python3.13
      Timeout: 30
      Architectures:
        - x86_64
      Environment:
        Variables:
          PLAYLIST_TABLE_NAME: !Ref PlaylistTable
          PLAYLIST_MUSIC_TABLE_NAME: !Ref PlaylistMusicTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlaylistMusicTable
      Events:
        DeletePlaylist:
          Type: Api
          Properties:
            RestApiId: !Ref RaddGateway
            Path: /playlists/{playlistId}
            Method: DELETE
            Auth:
              Authorizer: RaddAuthorizer

Outputs:
  ApiUrl:
    Description: Base URL for the API
    Value: !Sub "https://${RaddGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  UserTableName:
    Description: DynamoDB table name for users
    Value: !Ref UserTable

  AuthQueueUrl:
    Description: SQS queue URL for auth events
    Value: !Ref AuthQueue

  CreateUserFunctionArn:
    Description: Create User Lambda ARN
    Value: !GetAtt CreateUser.Arn

  GetUserFunctionArn:
    Description: Get User Lambda ARN
    Value: !GetAtt GetUser.Arn

  LoginFunctionArn:
    Description: Login Lambda ARN
    Value: !GetAtt Login.Arn

  MusicTableName:
    Description: DynamoDB table name for music
    Value: !Ref MusicTable

  Mp3BucketName:
    Description: S3 bucket for mp3 uploads
    Value: !Ref Mp3Bucket

  ImageBucketName:
    Description: S3 bucket for cover images
    Value: !Ref ImageBucket