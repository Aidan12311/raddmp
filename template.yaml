AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: > 
  RADD sam deployment template

Globals:
  Function:
    Timeout: 3
    MemorySize: 128
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:
  AuthQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: AuthQueue

  UserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RaddUsersTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  CreateUser:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: create_user/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref UserTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTable
      Events:
        CreateUser:
          Type: Api
          Properties:
            Path: /users
            Method: POST

  GetUser:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: get_user/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref UserTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
      Events:
        GetUser:
          Type: Api
          Properties:
            Path: /users
            Method: GET

  Login:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: login_user/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref UserTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
      Events:
        Login:
          Type: Api
          Properties:
            Path: /login
            Method: POST

Outputs:
  ApiUrl:
    Description: Base URL for the API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  UserTableName:
    Description: DynamoDB table name for users
    Value: !Ref UserTable

  AuthQueueUrl:
    Description: SQS queue URL for auth events
    Value: !Ref AuthQueue

  CreateUserFunctionArn:
    Description: Create User Lambda ARN
    Value: !GetAtt CreateUser.Arn

  GetUserFunctionArn:
    Description: Get User Lambda ARN
    Value: !GetAtt GetUser.Arn

  LoginFunctionArn:
    Description: Login Lambda ARN
    Value: !GetAtt Login.Arn